name: Pipeline

on:
  # manual trigger
  workflow_dispatch:
  # scheduled trigger
  schedule:
    - cron: '0 0 * * *'
  # push trigger
  push:
    # on main branch
    paths-ignore:
      - README.md
      - .github/**
      - .gitignore
      - Trigger.md

    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest # github hosted runner VM ubuntu
    steps:
      # - name: clone github repo
      #   run: |
      #    git clone https://github.com/github/my-repo.git
      #    cd my-repo
      - name: checkout steps
        uses: actions/checkout@v7

      - name: echo
        run: echo "Hello, World!" >> output.txt


      - name: list files after echo
        run: ls -la


      # use upload artifact action to upload output.txt
      - uses: actions/upload-artifact@v7
        with:
          name: first-artifact
          path: output.txt


      - name: list files after upload artifact
        run: ls -la

      - name: read file
        run: cat README.md

      # - name: install python
      #   # run: sudo apt-get update && sudo apt-get install -y python3 python3-pip
      #   uses: actions/setup-python@v4  # reuseable workflow 


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: deploy
        run: echo "Deploying..."

      # use download artifact action to download output.txt

      - name: read output
        run: cat output.txt