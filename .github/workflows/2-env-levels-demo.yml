name: 2 - Env levels demo

# Repo-level: set variable KEY=REPO in
# Settings → Secrets and variables → Actions → Variables
#
# Priority (same name KEY): step > job > workflow
# Repo vars are separate (vars.KEY) — they do not auto-become $KEY

on:
  push:
    # on main branch
    paths-ignore:
      - README.md
      - .github/**
      - .gitignore

    branches:
      - main
  workflow_dispatch:

# Workflow-level: KEY=WORKFLOW

# Environment variables Workflow Level
env:
  ITI_CLAM_VERSION: "49"
  KEY: WORKFLOW
  WORKFLOW_ENV: "I am workflow env"

jobs:
  # ---- Priority demo: print KEY at 3 levels ----
  print-repo-level:
    runs-on: ubuntu-latest
    steps:
      - name: Repo level (vars.KEY)
        run: |
          echo "Level: REPO"
          echo "vars.KEY=${{ vars.KEY }}"
          echo "(Set KEY=REPO in repo Actions variables to see REPO here)"

  print-workflow-level:
    runs-on: ubuntu-latest
    # No job KEY → inherits workflow KEY=WORKFLOW
    steps:
      - name: Workflow level ($KEY)
        run: |
          echo "Level: WORKFLOW"
          echo "WORKFLOW  ENVIRONMENT VARIABLE VALUE IS: $KEY =  ${{ env.KEY }}"

  print-job-level:
    needs: print-workflow-level
    if: success()
    runs-on: ubuntu-latest
    # Job KEY overrides workflow KEY
    env:
      KEY: JOB
    steps:
      - name: Job level ($KEY)
        run: |
          echo "Level: JOB"
          echo "JOB ENVIRONMENT VARIABLE VALUE IS: $KEY"

      - name: Step level ($KEY) — highest priority
        env:
          KEY: STEP
        run: |
          echo "Level: STEP (bonus — wins over job/workflow)"
          echo "STEP ENVIRONMENT VARIABLE VALUE IS: $KEY"

  # ---- Named envs at each scope (no override) ----
  show-named-envs:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: "I am job env"
    steps:
      - name: Print named envs
        env:
          STEP_ENV: "I am step env"
        run: |
          echo "vars.KEY (repo)=${{ vars.KEY }}"
          echo "WORKFLOW_ENV=$WORKFLOW_ENV"
          echo "JOB_ENV=$JOB_ENV"
          echo "STEP_ENV=$STEP_ENV"
