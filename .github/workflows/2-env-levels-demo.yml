name: 2 - Env levels demo

# Repo-level: set variable KEY=REPO in
# Settings → Secrets and variables → Actions → Variables
#
# Priority (same name KEY): step > job > workflow
# Repo vars are separate (vars.KEY) — they do not auto-become $KEY
#
# Two ways to read env in a step:
#   $KEY            → shell env var (runtime, inside run:)
#   ${{ env.KEY }}  → Actions "env" context (expression, evaluated by GHA)
# Use ${{ env.KEY }} when you need the value outside shell (if:, with:, name:, etc.)
# Use $KEY inside run: scripts (simpler). Both work in run: for workflow/job/step env.

on:
  push:
    # on main branch
    paths-ignore:
      - README.md
      # - .github/**
      - .gitignore

    branches:
      - main
  workflow_dispatch:

# Workflow-level: KEY=WORKFLOW
env:
  KEY: WORKFLOW
  WORKFLOW_ENV: "I am workflow env"

jobs:
  # ---- Priority demo: print KEY at 3 levels ----
  print-repo-level:
    runs-on: ubuntu-latest
    steps:
      - name: Repo level (vars.KEY)
        run: |
          echo "Level: REPO"
          echo "vars.KEY=${{ vars.KEY }}"
          echo "(Set KEY=REPO in repo Actions variables to see REPO here)"
          echo "(vars.KEY is NOT in env — ${{ env.KEY }} would be WORKFLOW here, not REPO)"

  print-workflow-level:
    runs-on: ubuntu-latest
    # No job KEY → inherits workflow KEY=WORKFLOW
    steps:
      - name: Workflow level ($KEY and ${{ env.KEY }})
        run: |
          echo "Level: WORKFLOW"
          echo "shell \$KEY=$KEY"
          echo "expression env.KEY=${{ env.KEY }}"

  print-job-level:
    runs-on: ubuntu-latest
    # Job KEY overrides workflow KEY
    env:
      KEY: JOB
    steps:
      - name: Job level ($KEY and ${{ env.KEY }})
        run: |
          echo "Level: JOB"
          echo "shell \$KEY=$KEY"
          echo "expression env.KEY=${{ env.KEY }}"

      - name: Step level ($KEY and ${{ env.KEY }}) — highest priority
        env:
          KEY: STEP
        run: |
          echo "Level: STEP (bonus — wins over job/workflow)"
          echo "shell \$KEY=$KEY"
          echo "expression env.KEY=${{ env.KEY }}"

  # ---- Named envs at each scope (no override) ----
  show-named-envs:
    runs-on: ubuntu-latest
    env:
      JOB_ENV: "I am job env"
    steps:
      - name: Print named envs
        env:
          STEP_ENV: "I am step env"
        run: |
          echo "vars.KEY (repo)=${{ vars.KEY }}"
          echo "WORKFLOW_ENV=$WORKFLOW_ENV / ${{ env.WORKFLOW_ENV }}"
          echo "JOB_ENV=$JOB_ENV / ${{ env.JOB_ENV }}"
          echo "STEP_ENV=$STEP_ENV / ${{ env.STEP_ENV }}"
          echo "KEY via env context=${{ env.KEY }}"
